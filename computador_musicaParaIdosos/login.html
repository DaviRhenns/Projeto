<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Instrumento – Entrar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3eee4;--panel:#fbf8f2;--line:#c9bfab;--text:#2a2622;--accent:#8a4b2d;--muted:#645b50;--err:#a32a1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232120;--panel:#2d2a28;--line:#4d4741;--text:#f0ebe3;--accent:#dba577;--muted:#b8ae9f;--err:#ff9a8a}}
:root[data-theme="dark"]{--bg:#232120;--panel:#2d2a28;--line:#4d4741;--text:#f0ebe3;--accent:#dba577;--muted:#b8ae9f;--err:#ff9a8a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:32px 16px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.9rem,8vw,2.6rem);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 24px;font-size:1.15rem}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.aba{font:inherit;font-weight:600;font-size:1.1rem;padding:14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.aba[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:1.3rem;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);margin-bottom:16px}
.mostrar{display:flex;align-items:center;gap:10px;font-weight:400;margin:-4px 0 18px}
.mostrar input{width:24px;height:24px}
.grande{width:100%;font:inherit;font-weight:700;font-size:1.25rem;padding:16px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.sec{width:100%;font:inherit;font-weight:600;font-size:1.15rem;padding:16px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);cursor:pointer;margin-top:16px}
.erro{color:var(--err);font-weight:600;min-height:1.4em;margin:0 0 12px}
.ou{text-align:center;color:var(--muted);margin:22px 0 0}
input:focus-visible,button:focus-visible{outline:4px solid var(--text);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Meu Instrumento</h1>
  <p class="sub">Entre para continuar</p>

  <div class="abas">
    <button class="aba" id="a-entrar" aria-pressed="true" type="button">Entrar</button>
    <button class="aba" id="a-criar" aria-pressed="false" type="button">Criar conta</button>
  </div>

  <p class="erro" id="erro" role="alert"></p>

  <form id="f-entrar">
    <label for="e-usuario">Usuário</label>
    <input type="text" id="e-usuario" autocomplete="username" autocapitalize="none" required>
    <label for="e-senha">Senha</label>
    <input type="password" id="e-senha" autocomplete="current-password" required>
    <label class="mostrar"><input type="checkbox" class="ver"> Mostrar senha</label>
    <button class="grande" type="submit">Entrar</button>
  </form>

  <form id="f-criar" hidden>
    <label for="c-usuario">Escolha um nome de usuário</label>
    <input type="text" id="c-usuario" autocomplete="username" autocapitalize="none" required>
    <label for="c-senha">Escolha uma senha (mínimo 6 caracteres)</label>
    <input type="password" id="c-senha" autocomplete="new-password" required minlength="6">
    <label for="c-conf">Repita a senha</label>
    <input type="password" id="c-conf" autocomplete="new-password" required>
    <label class="mostrar"><input type="checkbox" class="ver"> Mostrar senha</label>
    <button class="grande" type="submit">Criar conta e entrar</button>
  </form>

  <p class="ou">ou</p>
  <button class="sec" id="visitante" type="button">Entrar sem login</button>
</div>

<script>
const $=id=>document.getElementById(id);
const erro=t=>{$("erro").textContent=t;};
function aba(m){
  $("f-entrar").hidden=m!=="entrar";$("f-criar").hidden=m!=="criar";
  $("a-entrar").setAttribute("aria-pressed",m==="entrar");
  $("a-criar").setAttribute("aria-pressed",m==="criar");
  erro("");
}
$("a-entrar").onclick=()=>aba("entrar");
$("a-criar").onclick=()=>aba("criar");

document.querySelectorAll(".ver").forEach(cb=>cb.onchange=()=>{
  document.querySelectorAll("input[type=password],input[data-senha]").forEach(i=>{
    i.type=cb.checked?"text":"password";i.dataset.senha="1";});
  document.querySelectorAll(".ver").forEach(o=>o.checked=cb.checked);
});

async function enviar(rota,dados){
  const r=await fetch(rota,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dados)});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(j.erro||"Algo deu errado. Tente de novo.");
  return j;
}
async function acao(rota,dados){
  erro("");
  try{await enviar(rota,dados);location.href="/app";}
  catch(e){erro(e.message==="Failed to fetch"?"Não consegui falar com o servidor. Ele está ligado?":e.message);}
}
$("f-entrar").onsubmit=e=>{e.preventDefault();
  acao("/api/login",{usuario:$("e-usuario").value,senha:$("e-senha").value});};
$("f-criar").onsubmit=e=>{e.preventDefault();
  if($("c-senha").value!==$("c-conf").value){erro("As duas senhas não são iguais.");return;}
  acao("/api/cadastro",{usuario:$("c-usuario").value,senha:$("c-senha").value});};
$("visitante").onclick=()=>acao("/api/visitante",{});
</script>
</body>
</html>
